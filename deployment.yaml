apiVersion: apps/v1
kind: Deployment

metadata:
  name: sentiment-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: sentiment-app

  template:
    metadata:
      labels:
        app: sentiment-app

    spec:
      containers:
      - name: sentiment-container

        image: mahesh9390/sentiment-analysis:latest

        ports:
        - containerPort: 8501